plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // Processing 4 (fork modular publicado no Maven Central, sem dependências transitivas)
    implementation 'org.praxislive.libp5x:processing-core:4.430.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'mssn.Main'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

test {
    useJUnitPlatform()
}